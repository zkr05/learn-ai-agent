name: weekly-review

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC = 北京时间 10:00
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 复盘要读完整 git 历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r study-review-agent/requirements.txt

      - name: 运行复盘 agent
        working-directory: study-review-agent
        env:
          CLOUD_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLOUD_BASE_URL: ${{ vars.LLM_BASE_URL }}
          CLOUD_MODEL: ${{ vars.LLM_MODEL }}
          CLOUD_PRICE_IN: ${{ vars.LLM_PRICE_IN }}
          CLOUD_PRICE_OUT: ${{ vars.LLM_PRICE_OUT }}
        run: python review_agent.py --backend cloud --days 7

      - name: 提交报告回仓库
        run: |
          git config user.name "study-review-agent"
          git config user.email "actions@users.noreply.github.com"
          git add study-review-agent/reports/
          git diff --cached --quiet || git commit -m "复盘报告：自动周报 $(date -u +%F)"
          git push
