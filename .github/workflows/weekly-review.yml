name: weekly-review

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch: {} # 手动触发已配好，schedule 自己补

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: pip install -r study-review-agent/requirements.txt
      - name: 跑 eval (质量门禁)
        run: cd study-review-agent && python review_agent.py --eval
        env:
          CLOUD_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLOUD_BASE_URL: "https://api.deepseek.com/v1"
          CLOUD_MODEL: "deepseek-v4-flash"
      - name: 生成周报
        run: cd study-review-agent && python review_agent.py --backend cloud --days 7
        env:
          CLOUD_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLOUD_BASE_URL: "https://api.deepseek.com/v1"
          CLOUD_MODEL: "deepseek-v4-flash"
          CLOUD_PRICE_IN: "1"
          CLOUD_PRICE_OUT: "4"
      - name: 提交报告
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add study-review-agent/reports/
          git diff --cached --quiet || git commit -m "chore: 周报 $(date +%F)"
          git pull --rebase origin master
          git push

  mcp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 装依赖
        run: pip install -r study-review-agent/requirements.txt
      - name: 跑 MCP server 验收测试（stdio 端到端）
        run: cd study-review-agent && python test_mcp_reports.py
