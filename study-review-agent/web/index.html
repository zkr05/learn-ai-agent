<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>学习复盘周报</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #6d6f74;
            padding: 24px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 720px;
        }
        
        .card {
            display: flex;
            gap: 16px;
            padding: 14px 18px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .88);
        }

        .card:hover {
            background: #eef4ff;
        }
        .detail {
          max-width: 720px;
          margin-top: 20px;
          padding: 16px 20px;
          background: #fff;
          border-radius: 8px;
          min-height: 40px;
          font-size: 14px;
          line-height: 1.7;
          white-space: pre-wrap;
        }
        .week { font-weight: 700; width: 90px; }
        .file { flex: 1; color: #555; }
        .size, .date{ color: #888; font-size: 13px; }
    </style>
</head>
<body>
    <h1>学习复盘周报</h1>
    <div class="list"></div>
    <div class="detail"></div>

    <script>
      async function render(){
        const resp = await fetch("http://127.0.0.1:8000/reports");
        const data = await resp.json();
        const reports = data.reports;
      

      let html = "";
      for(const r of reports){
        html += `<div class="card" data-week="${r.week}">
          <span class="week">${r.week}</span>
          <span class="file">${r.file}</span>
          <span class="size">${r.size_bytes} 字节</span>
          <span class="date">${r.modified}</span>
        </div>`;
      }

      document.querySelector(".list").innerHTML = html;
    }

      const listEl = document.querySelector(".list");
      const detailEl = document.querySelector(".detail");

      listEl.addEventListener("click", async (e) => {
        const card = e.target.closest(".card");
        if(!card) return;
        
        const week = card.dataset.week;
        if(!week) return;
        const resp = await fetch(`http://127.0.0.1:8000/reports/${week}`);
        if(!resp.ok){
          detailEl.textContent = `加载失败：${resp.status}`;
          return;
        }
        const data = await resp.json();
        detailEl.textContent = data.content;
      });
      render();
    </script>
</body>
</html>
