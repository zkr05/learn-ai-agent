<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>学习复盘周报</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #6d6f74;
            padding: 24px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 720px;
        }
        
        .card {
            display: flex;
            gap: 16px;
            padding: 14px 18px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .88);
        }

        .card:hover {
            background: #eef4ff;
        }

        .week { font-weight: 700; width: 90px; }
        .file { flex: 1; color: #555; }
        .size, .date{ color: #888; font-size: 13px; }
    </style>
</head>
<body>
    <h1>学习复盘周报</h1>
    <div class="list"></div>

    <script>
      async function render(){
        const resp = await fetch("http://127.0.0.1:8000/reports");
        const data = await resp.json();
        const reports = data.reports;
      

      let html = "";
      for(const r of reports){
        html += `<div class="card">
          <span class="week">${r.week}</span>
          <span class="file">${r.file}</span>
          <span class="size">${r.size_bytes} 字节</span>
          <span class="date">${r.modified}</span>
        </div>`;
      }

      document.querySelector(".list").innerHTML = html;
    }
      render();
    </script>
</body>
</html>
